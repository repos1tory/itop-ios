name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true
      publish:
        description: "Create the release and update the APT repo"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    uses: repos1tory/repos1tory.github.io/.github/workflows/publish-tweak.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      publish: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true' }}
      build_command: |
        brew list ldid >/dev/null 2>&1 || brew install ldid
        brew list dpkg >/dev/null 2>&1 || brew install dpkg
        SDK="$(xcrun --sdk iphoneos --show-sdk-path)" bash build.sh build
      deb_glob: "packages/*.deb"
      group: apps
      theos: false
    secrets: inherit
